schema: uci_arena_component_reasoning_graph_v1
graph_id: uci_arena_syzygy_root_provider
version: 1
status: initial_owner_directed
component: syzygy.root-provider
concern_areas: [C01, C03, C04, C05, C08, C09, C12]
global_graph:
  repository: iteathen/uci-arena-installer
  path: reasoning/suite_graph_v1.yaml

imports:
  objectives: [G-O1, G-O2]
  premises: [G-P4, G-P6, G-P10, G-P17, G-P20, G-P21, G-P23, G-P27, G-P28]
  targets: [G-T1, G-T4, G-T5, G-T6, G-T8, G-T10, G-T12]

local_objectives:
  - id: S-O1
    statement: >
      Supply exact offline root tablebase knowledge that improves or constrains engine chess
      decisions without becoming a competing search, legality, or timing authority.
    derived_from: [G-O1, G-T1]
    confidence: 0.995
  - id: S-O2
    statement: >
      Make exact root knowledge a bounded, replaceable external capability that can be
      installed and consumed without embedding tablebase implementation into the engine.
    derived_from: [G-O2, G-T5, G-T12]
    confidence: 0.97

premises:
  - id: S-P1
    statement: >
      Syzygy WDL/DTZ knowledge is exact only inside the admitted dataset/rule/history scope;
      missing required history or data cannot be replaced by optimistic inference.
    confidence: 0.995
  - id: S-P2
    statement: >
      The provider owns offline root knowledge access while Vector owns canonical chess state,
      legal actions, search, model semantics, and live timing.
    confidence: 0.999
  - id: S-P3
    statement: >
      Root-only knowledge can resolve or safely constrain a current move without requiring
      active-leaf callbacks into ongoing search.
    confidence: 0.98
  - id: S-P4
    statement: >
      Draw-claim policy, repetition history, dataset identity, and exact package/runtime
      identity can materially change the meaning of a root tablebase result.
    confidence: 0.99
  - id: S-P5
    statement: >
      The root-knowledge provider is independently replaceable; hidden engine coupling would
      merge otherwise separate lifecycles and increase substitution and change radius.
    confidence: 0.97

  - id: S-P6
    statement: >
      Tablebase availability and exactness are properties of the admitted dataset coverage,
      rule/history context, and provider capability; a missing or partial local dataset does
      not imply that the chess position has no exact tablebase truth in principle.
    confidence: 0.99
  - id: S-P7
    statement: >
      Enabling or disabling root tablebase knowledge changes the engine's experimental
      condition and can change downstream move choice, clock use, and search workload.
    confidence: 0.99

premise_metadata:
  S-P1: {kind: structural}
  S-P2: {kind: structural}
  S-P3: {kind: structural}
  S-P4: {kind: structural}
  S-P5: {kind: structural}
  S-P6: {kind: structural}
  S-P7: {kind: structural}

implicit_assertions:
  - id: S-A1
    statement: >
      A tablebase result outside its exact admitted history/dataset/rule scope is not made
      authoritative merely because the underlying position has few pieces.
    derived_from: [S-P1, S-P4, G-P6]
    confidence: 0.999
  - id: S-A2
    statement: >
      Adding active-leaf or timing callbacks would change the provider from root knowledge
      into search infrastructure and violate the intended ownership boundary.
    derived_from: [S-P2, S-P3]
    confidence: 0.995
  - id: S-A3
    statement: >
      A virtual draw claim or deferred refinement cannot be relabeled as an exact legal move.
    derived_from: [S-P1, S-P4]
    confidence: 0.999
  - id: S-A4
    statement: >
      Dataset/package provenance is part of chess-result truth because a stale or incomplete
      file set can change which exact claims are supported.
    derived_from: [S-P1, G-P6]
    confidence: 0.98

  - id: S-A5
    statement: >
      A search or timing comparison that changes tablebase availability between cohorts cannot
      cleanly attribute the result to search/timing quality unless tablebase difference is the
      declared treatment.
    derived_from: [S-P7, G-P17, G-P21]
    confidence: 0.995
  - id: S-A6
    statement: >
      Provider unavailability or incomplete local coverage must be reported as capability
      state rather than evidence that no exact root solution exists.
    derived_from: [S-P6]
    confidence: 0.99

  - id: S-A7
    statement: >
      Qualification over a closed three-piece or otherwise narrow dataset subset cannot be
      promoted into broad six-piece coverage, performance, or live-engine acceptance without
      evidence for that wider scope.
    derived_from: [S-P6, G-P28]
    confidence: 0.999

assertion_metadata:
  S-A1: {inference: structural, boundary: "Few-piece status alone is neither necessary nor sufficient authority; exact admitted coverage/context remains decisive."}
  S-A2: {inference: structural, boundary: "The provider may perform bounded root refinement; the boundary excludes ownership of ongoing search policy/timing."}
  S-A3: {inference: structural, boundary: "Claim-related information can still constrain or inform search without becoming an exact move."}
  S-A4: {inference: structural, boundary: "Package provenance supports exact scope but does not alone prove tablebase chess semantics or broad coverage."}
  S-A5: {inference: structural, boundary: "Changing tablebase availability is valid when it is the declared experimental treatment."}
  S-A6: {inference: structural, boundary: "Unavailability of the provider does not imply absence of mathematical tablebase truth; it is an operational capability fact."}
  S-A7: {inference: structural, boundary: "Narrow qualification remains valid for the narrow dataset/cases it actually exercised."}

implementation_targets:
  - id: S-T1
    name: establish_exact_root_knowledge_identity_and_coverage
    statement: >
      Identify the exact tablebase data, provider/runtime identity, and supported position
      scope required to interpret a root-knowledge result.
    supports: [S-O1, G-T1]
  - id: S-T2
    name: apply_root_knowledge_only_under_sufficient_rule_and_history_context
    statement: >
      Admit root tablebase meaning only when the rule, history, draw-claim, and state context
      required by that meaning is available and compatible.
    supports: [S-O1, G-T1]
  - id: S-T3
    name: provide_complete_exact_root_safety_information_when_available
    statement: >
      Return exact root outcome/safety information over the admitted available dataset without
      silently narrowing or fabricating coverage.
    supports: [S-O1]
  - id: S-T4
    name: refine_exactly_or_defer_truthfully
    statement: >
      Improve root knowledge when exact supporting information is available and otherwise
      preserve completed safe information while reporting refinement as deferred/unavailable.
    supports: [S-O1, G-T4]
  - id: S-T5
    name: preserve_exact_draw_claim_terminal_and_move_meaning
    statement: >
      Keep claims, adjudicated terminal outcomes, constraints, and exact legal-move resolution
      semantically distinct.
    supports: [S-O1, G-T1]
  - id: S-T6
    name: keep_provider_interaction_bounded_cancellable_and_replaceable
    statement: >
      Expose root knowledge through bounded, cancellable interaction whose failure or
      replacement does not entangle engine search lifecycle.
    supports: [S-O2, G-T8]
  - id: S-T7
    name: remain_root_knowledge_without_acquiring_search_or_timing_authority
    statement: >
      Provide external root information without becoming an owner of active-leaf search,
      canonical engine state, move selection, or live timing policy.
    supports: [S-O1, G-T6]
  - id: S-T8
    name: remain_independently_deployable_and_relocatable
    statement: >
      Package and deploy the provider as a self-contained replaceable capability without
      requiring private source-tree or engine-layout coupling.
    supports: [S-O2, G-T12]
  - id: S-T9
    name: report_root_knowledge_capability_truthfully
    statement: >
      Distinguish exact result, constrained result, deferred refinement, missing coverage,
      capacity pressure, and provider unavailability without optimistic substitution.
    supports: [G-T4, G-T9]

